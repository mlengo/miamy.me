<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mia Ngo</title>
  <meta name="description" content="Personal site of My Huong (Mia) Ngo.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥭</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fdf6e9;
      --ink: #1f2a2e;
      --muted: #5b6a6f;
      --accent: #e8a317;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #17201f;
        --ink: #f3ede0;
        --muted: #a9b5b1;
        --accent: #f2b63a;
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg: #17201f;
      --ink: #f3ede0;
      --muted: #a9b5b1;
      --accent: #f2b63a;
      color-scheme: dark;
    }
    :root {
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
      background: var(--bg);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: "Press Start 2P", ui-monospace, "Courier New", monospace;
      display: grid;
      place-items: center;
      padding: 2rem;
      -webkit-font-smoothing: none;
      font-smooth: never;
    }
    main { max-width: 40rem; width: 100%; }
    h1 {
      font-size: clamp(1.6rem, 6.5vw, 3.4rem);
      font-weight: 400;
      line-height: 1.3;
      margin: 0 0 1.25rem;
    }
    .stage {
      position: relative;
      height: 32px;
      margin: 0 0 1.25rem;
      overflow: hidden;
    }
    #sprite {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 40px;
      height: 32px;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    p {
      font-size: clamp(0.9rem, 3vw, 1.25rem);
      line-height: 1.8;
      color: var(--muted);
      margin: 0;
      min-height: 1.8em;
    }
    .name { color: var(--ink); }
    .cursor {
      display: inline-block;
      width: 0.6em;
      height: 1em;
      margin-left: 0.15em;
      vertical-align: -0.1em;
      background: var(--accent);
      animation: blink 1s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
    .sr-only {
      position: absolute; width: 1px; height: 1px; overflow: hidden;
      clip: rect(0 0 0 0); white-space: nowrap;
    }
    @media (prefers-reduced-motion: reduce) {
      .cursor { animation: none; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Hello, World</h1>
    <div class="stage" aria-hidden="true"><canvas id="sprite" width="20" height="16"></canvas></div>
    <p>
      <span class="sr-only">I’m My Huong, also known as Mia.</span>
      <span aria-hidden="true">I’m <span class="name" id="name"></span><span class="cursor"></span></span>
    </p>
  </main>
  <script>
    const names = ["Mia", "My", "Me", "My Huong"];
    const el = document.getElementById("name");
    const wait = ms => new Promise(r => setTimeout(r, ms));

    async function run() {
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        el.textContent = names[names.length - 1];
        return;
      }
      await wait(600);
      while (true) {
        for (let i = 0; i < names.length; i++) {
          const word = names[i];
          for (let c = 1; c <= word.length; c++) {
            el.textContent = word.slice(0, c);
            await wait(140);
          }
          // Linger a bit longer on the full name before starting over
          await wait(i === names.length - 1 ? 2200 : 1100);
          for (let c = word.length - 1; c >= 0; c--) {
            el.textContent = word.slice(0, c);
            await wait(80);
          }
          await wait(350);
        }
      }
    }
    run();

    // 8-bit sprite: walks in, turns to face you, then waves
    const FRAMES = {
      walkA: ["......KKKKKKKK......", "....KKHHHHPKPK......", "...KHHHHHHHKKHK.....", "...KHHHHHHHHHHHK....", "...KHHHHHSSSSSSK....", "...KHHHHSSSSKSSK....", "...KHHHHSSSSKSSK....", "...KHHHHSSSSSSSK....", "....KHHHSSSSSSK.....", "....HHKRRRRRKK......", "....KHRGKSSK........", ".....KRGKSSK........", ".....KDDDDDDK.......", ".....KDDDDDDDK......", "......KDK..KDK......", "......KKK..KKK......"],
      walkB: ["......KKKKKKKK......", "....KKHHHHPKPK......", "...KHHHHHHHKKHK.....", "...KHHHHHHHHHHHK....", "...KHHHHHSSSSSSK....", "...KHHHHSSSSKSSK....", "...KHHHHSSSSKSSK....", "...KHHHHSSSSSSSK....", "....KHHHSSSSSSK.....", "....HHKRRRRRKK......", "....KHRGRKSK........", ".....KRGRKSK........", ".....KDDDDDDK.......", ".....KDDDDDDK.......", ".......KDDDK........", ".......KKKKK........"],
      front: [".......KKKKKKKK.KK..", ".....KKHHHHHHKPKPK..", "....KHHHHHHHHHHKK...", "....KHHHHHHHHHHK....", "...KHHSSSSSSSSHHK...", "...KHSSKSSSSKSSHK...", "...KHSSKSSSSKSSHK...", "...KHSSSSSSSSSSHK...", "...KHHSSSSSSSSHHK...", "....HKKRRRRRRKKH....", "...KKSKGRRRRGKSKK...", "....KSKRGGGGRKSK....", ".....KKDDDDDDKK.....", ".....KDDDDDDDDK.....", "......KDDKKDDK......", "......KKK..KKK......"],
      waveA: [".......KKKKKKKK.KK..", ".....KKHHHHHHKPKPK..", "....KHHHHHHHHHHKK...", "....KHHHHHHHHHHK....", "...KHHSSSSSSSSHHKKK.", "...KHSSKSSSSKSSKSSK.", "...KHSSKSSSSKSSKSK..", "...KHSSSSSSSSSSKSK..", "...KHHSSSSSSSSHKSK..", "....HKKRRRRRRKKK....", "...KKSKGRRRRGK......", "....KSKRGGGGRK......", ".....KKDDDDDDKK.....", ".....KDDDDDDDDK.....", "......KDDKKDDK......", "......KKK..KKK......"],
      waveB: [".......KKKKKKKK.KK..", ".....KKHHHHHHKPKPK..", "....KHHHHHHHHHHKK...", "....KHHHHHHHHHKKK...", "...KHHSSSSSSSSKSSK..", "...KHSSKSSSSKSSKSK..", "...KHSSKSSSSKSSKSK..", "...KHSSSSSSSSSSKSK..", "...KHHSSSSSSSSHKSK..", "....HKKRRRRRRKKK....", "...KKSKGRRRRGK......", "....KSKRGGGGRK......", ".....KKDDDDDDKK.....", ".....KDDDDDDDDK.....", "......KDDKKDDK......", "......KKK..KKK......"]
    };
    const PALETTE = { K: "#1f2a2e", H: "#3b2219", S: "#f6d7b0", R: "#2a9d8f", D: "#1f7a70", P: "#e8577a", G: "#c9d1d3" };
    const canvas = document.getElementById("sprite");
    const ctx = canvas.getContext("2d");

    function draw(name) {
      ctx.clearRect(0, 0, 20, 16);
      FRAMES[name].forEach((row, y) => {
        [...row].forEach((ch, x) => {
          if (PALETTE[ch]) { ctx.fillStyle = PALETTE[ch]; ctx.fillRect(x, y, 1, 1); }
        });
      });
    }

    async function waveFor(times) {
      for (let i = 0; i < times; i++) {
        draw("waveA"); await wait(220);
        draw("waveB"); await wait(220);
      }
      draw("front");
    }

    async function walkIn() {
      if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
        draw("front");
        return;
      }
      const steps = 14;
      const start = -40;
      for (let i = 0; i <= steps; i++) {
        canvas.style.transform = `translateX(${Math.round(start + (-start) * i / steps)}px)`;
        draw(i % 2 ? "walkA" : "walkB");
        await wait(140);
      }
      draw("front");
      await wait(350);
      await waveFor(4);
      while (true) {
        await wait(6000);
        await waveFor(3);
      }
    }
    walkIn();
  </script>
</body>
</html>
