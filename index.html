<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mia Ngo</title>
  <meta name="description" content="Personal site of My Huong (Mia) Ngo.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥭</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fdf6e9;
      --ink: #1f2a2e;
      --muted: #5b6a6f;
      --accent: #e8a317;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #17201f;
        --ink: #f3ede0;
        --muted: #a9b5b1;
        --accent: #f2b63a;
        color-scheme: dark;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: "Bricolage Grotesque", system-ui, -apple-system, "Segoe UI", sans-serif;
      display: grid;
      place-items: center;
      padding: 2rem;
    }
    main { max-width: 36rem; }
    h1 {
      font-size: clamp(3rem, 12vw, 6.5rem);
      font-weight: 700;
      line-height: 0.95;
      letter-spacing: -0.03em;
      margin: 0 0 1.5rem;
    }
    h1::after {
      content: "";
      display: block;
      width: 3.5rem;
      height: 0.5rem;
      border-radius: 1rem;
      background: var(--accent);
      margin-top: 1.25rem;
    }
    p {
      font-size: 1.25rem;
      line-height: 1.5;
      color: var(--muted);
      margin: 0;
    }
  </style>
</head>
<body>
  <main>
    <h1>Hello, world.</h1>
    <p>I’m Mia Ngo. This site is under construction — my resume is coming soon.</p>
  </main>
</body>
</html>
