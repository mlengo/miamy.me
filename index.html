<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mia Ngo</title>
  <meta name="description" content="Personal site of My Huong (Mia) Ngo.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥭</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fdf6e9;
      --ink: #1f2a2e;
      --muted: #5b6a6f;
      --accent: #e8a317;
      --shell: #f2b63a;
      --shell-dark: #c98d14;
      --bezel: #2c3438;
      --lcd: #d3dcbc;
      --lcd-ink: #26301f;
      --lcd-muted: #4d5a3e;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #17201f;
        --ink: #f3ede0;
        --muted: #a9b5b1;
        --accent: #f2b63a;
        color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg: #17201f;
      --ink: #f3ede0;
      --muted: #a9b5b1;
      --accent: #f2b63a;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: "Press Start 2P", ui-monospace, "Courier New", monospace;
      overflow: hidden;
      -webkit-font-smoothing: none;
      font-smooth: never;
    }

    /* ---------- the page itself, which later becomes the handheld's screen ---------- */
    .screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      z-index: 2;
      container-type: size;
      display: grid;
      place-items: center;
      background: var(--bg);
      border-radius: 0;
      transition:
        top 1.6s cubic-bezier(.65, 0, .35, 1),
        left 1.6s cubic-bezier(.65, 0, .35, 1),
        width 1.6s cubic-bezier(.65, 0, .35, 1),
        height 1.6s cubic-bezier(.65, 0, .35, 1),
        transform 1.6s cubic-bezier(.65, 0, .35, 1),
        background-color .8s ease 1s,
        border-radius 1.6s ease;
      transform-origin: 0 0;
    }
    .inner { width: 100%; max-width: max(50cqw, min(100%, 40rem)); padding: 0 4cqw; }
    h1 {
      font-size: min(6.8cqw, 3.4rem, 13cqh);
      font-weight: 400;
      line-height: 1.3;
      margin: 0 0 0.5em;
      transition: color .8s ease 1s;
    }
    .stage {
      position: relative;
      height: min(9cqw, 32px, 13cqh);
      margin: 0 0 0.6em;
      overflow: hidden;
      font-size: min(6.5cqw, 3.4rem, 12cqh);
    }
    #sprite {
      position: absolute;
      left: 0;
      bottom: 0;
      height: 100%;
      aspect-ratio: 20 / 16;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    p {
      font-size: min(4.6cqw, 1.25rem, 6.5cqh);
      line-height: 1.8;
      color: var(--muted);
      margin: 0;
      min-height: 1.8em;
      transition: color .8s ease 1s;
    }
    .name { color: var(--ink); transition: color .8s ease 1s; }
    .cursor {
      display: inline-block;
      width: 0.6em;
      height: 1em;
      margin-left: 0.15em;
      vertical-align: -0.1em;
      background: var(--accent);
      animation: blink 1s steps(1) infinite;
    }
    @keyframes blink { 50% { opacity: 0; } }
    .sr-only {
      position: absolute; width: 1px; height: 1px; overflow: hidden;
      clip: rect(0 0 0 0); white-space: nowrap;
    }

    /* once zoomed out, the page takes on an LCD look */
    .zoomed .screen { background: var(--lcd); border-radius: 6px; }
    .zoomed h1, .zoomed .name { color: var(--lcd-ink); }
    .zoomed p { color: var(--lcd-muted); }

    /* ---------- the handheld (original design) ---------- */
    .device {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      z-index: 1;
      opacity: 0;
      transform: scale(calc(var(--k, 1) * 2.6));
      transition: transform 1.6s cubic-bezier(.65, 0, .35, 1), opacity .9s ease;
      pointer-events: none;
    }
    .zoomed .device { opacity: 1; transform: scale(var(--k, 1)); }
    .shell {
      width: 760px;
      flex: none;
      aspect-ratio: 2 / 1.05;
      filter: drop-shadow(0 18px 22px rgba(0, 0, 0, .16));
      display: grid;
      grid-template-columns: 1fr 2.3fr 1fr;
      align-items: center;
      padding: 0 23px;
      isolation: isolate;
      position: absolute;
      left: 50%;
      top: 50%;
      translate: -50% -50%;
    }
    /* body outline: straight sides, corners scooped gently inward */
    .shell::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      clip-path: path("M68 0 H692 C702 0 708 4 712 10 C718.67 28.67 731.33 41.33 750 48 C756 52 760 58 760 68 V313 C760 323 756 329 750 333 C731.33 339.67 718.67 352.33 712 371 C708 377 702 381 692 381 C560 405 200 405 68 381 C58 381 52 377 48 371 C41.33 352.33 28.67 339.67 10 333 C4 329 0 323 0 313 V68 C0 58 4 52 10 48 C28.67 41.33 41.33 28.67 48 10 C52 4 58 0 68 0 Z");
      background:
        linear-gradient(180deg, rgba(255, 255, 255, .35) 0 4px, transparent 4px calc(100% - 10px), var(--shell-dark) calc(100% - 10px)),
        var(--shell);
    }
    .bezel {
      background: var(--bezel);
      border-radius: 4.5% / 6%;
      padding: 5% 6% 9%;
      position: relative;
    }
    .slot { width: 100%; aspect-ratio: 4 / 3; }
    .brand {
      position: absolute;
      left: 0; right: 0; bottom: 2.5%;
      text-align: center;
      color: #c9d1d3;
      font-size: 10px;
      letter-spacing: .15em;
    }
    .power {
      position: absolute;
      left: 6%; top: 50%;
      width: 2.2%; aspect-ratio: 1;
      border-radius: 50%;
      background: #e8577a;
      box-shadow: 0 0 6px #e8577a;
    }
    .stick {
      justify-self: center;
      width: 62%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: var(--shell-dark);
      box-shadow: inset 0 4px 8px rgba(0, 0, 0, .25);
      display: grid;
      place-items: center;
    }
    .stick::after {
      content: "";
      width: 58%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: var(--bezel);
      box-shadow: inset 0 -4px 0 rgba(0, 0, 0, .35), inset 0 3px 0 rgba(255, 255, 255, .12);
    }
    .buttons {
      justify-self: center;
      width: 70%;
      aspect-ratio: 1;
      display: grid;
      grid-template: repeat(3, 1fr) / repeat(3, 1fr);
    }
    .buttons i, .buttons .btn-next {
      border-radius: 50%;
      background: #2a9d8f;
      box-shadow: inset 0 -3px 0 rgba(0, 0, 0, .3);
      margin: 6%;
    }
    .buttons i:nth-child(1) { grid-area: 1 / 2; }
    .buttons i:nth-child(2) { grid-area: 2 / 1; }
    .buttons i:nth-child(3), .buttons .btn-next { grid-area: 2 / 3; }
    .buttons i:nth-child(4) { grid-area: 3 / 2; }

    /* the right-hand button flips between screens */
    .btn-next {
      border: 0;
      padding: 0;
      font: inherit;
      pointer-events: none;
      transition: transform .08s ease, box-shadow .08s ease, filter .15s ease;
    }
    .zoomed .btn-next { pointer-events: auto; cursor: pointer; }
    .btn-next:hover { filter: brightness(1.12); }
    .btn-next:active, .btn-next.pressed {
      transform: translateY(2px);
      box-shadow: inset 0 -1px 0 rgba(0, 0, 0, .3);
    }
    .btn-next:focus-visible { outline: 3px solid var(--bezel); outline-offset: 3px; }

    .screen.switching .inner { visibility: hidden; }
    .hint {
      position: absolute;
      right: 4cqw;
      bottom: 4cqh;
      font-size: min(2.8cqw, 11px);
      color: var(--lcd-muted);
      opacity: 0;
      transition: opacity .6s ease 1.4s;
      pointer-events: none;
    }
    .zoomed .hint { opacity: 1; }
    .blink-arrow { animation: blink 1s steps(1) infinite; }
    .grille {
      position: absolute;
      right: 7%; bottom: 9%;
      display: flex; gap: 6px;
    }
    .grille b { width: 4px; height: 18px; border-radius: 2px; background: var(--shell-dark); }

    @media (prefers-reduced-motion: reduce) {
      .cursor { animation: none; }
      .screen, .device, h1, p, .name, .hint { transition: none; }
      .blink-arrow { animation: none; }
    }

    /* debug-only reset button (hidden on the live site) */
    .debug-reset {
      position: fixed;
      right: 12px;
      bottom: calc(12px + env(safe-area-inset-bottom, 0px));
      z-index: 10;
      font: inherit;
      font-size: 10px;
      padding: 10px 12px;
      border: 2px solid var(--ink);
      border-radius: 0;
      background: var(--bg);
      color: var(--ink);
      box-shadow: 3px 3px 0 var(--ink);
      cursor: pointer;
    }
    .debug-reset:active { transform: translate(2px, 2px); box-shadow: 1px 1px 0 var(--ink); }
    .debug-reset:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .debug-reset[hidden] { display: none; }
  </style>
</head>
<body>
  <div class="device" id="device" inert>
    <div class="shell">
      <span class="power" aria-hidden="true"></span>
      <div class="stick" aria-hidden="true"></div>
      <div class="bezel" aria-hidden="true">
        <div class="slot" id="slot"></div>
        <div class="brand">MIAMY</div>
      </div>
      <div class="buttons"><i></i><i></i><button class="btn-next" id="btnNext" type="button" aria-label="Show About Me"></button><i></i></div>
      <div class="grille" aria-hidden="true"><b></b><b></b><b></b></div>
    </div>
  </div>

  <button class="debug-reset" id="debugReset" type="button" hidden>Reset</button>

  <main class="screen" id="screen">
    <div class="inner" id="home">
      <h1>Hello, World</h1>
      <div class="stage" aria-hidden="true"><canvas id="sprite" width="20" height="16"></canvas></div>
      <p>
        <span class="sr-only">I’m My Huong, also known as Mia.</span>
        <span aria-hidden="true">I’m <span class="name" id="name"></span><span class="cursor"></span></span>
      </p>
    </div>

    <div class="inner" id="about" hidden>
      <h1>About Me</h1>
      <p>Coming soon...</p>
    </div>

    <div class="hint" id="hint" aria-hidden="true"><span class="blink-arrow">&gt;</span> <span id="hintText">About Me</span></div>
    <span class="sr-only" id="announce" aria-live="polite"></span>
  </main>

  <script>
    const names = ["Mia", "My", "Me", "My Huong"];
    const el = document.getElementById("name");
    const wait = ms => new Promise(r => setTimeout(r, ms));
    const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    async function run() {
      if (reduced) {
        el.textContent = names[names.length - 1];
        return;
      }
      await wait(600);
      while (true) {
        for (let i = 0; i < names.length; i++) {
          const word = names[i];
          for (let c = 1; c <= word.length; c++) {
            el.textContent = word.slice(0, c);
            await wait(140);
          }
          // Linger a bit longer on the full name before starting over
          await wait(i === names.length - 1 ? 2200 : 1100);
          for (let c = word.length - 1; c >= 0; c--) {
            el.textContent = word.slice(0, c);
            await wait(80);
          }
          await wait(350);
        }
      }
    }
    run();

    // 8-bit sprite: walks in, turns to face you, then waves
    const FRAMES = {
      walkA: ["......KKKKKKKK......", "....KKHHHHPKPK......", "...KHHHHHHHKKHK.....", "...KHHHHHHHHHHHK....", "...KHHHHHSSSSSSK....", "...KHHHHSSSSKSSK....", "...KHHHHSSSSKSSK....", "...KHHHHSSSSSSSK....", "....KHHHSSSSSSK.....", "....HHKRRRRRKK......", "....KHRGKSSK........", ".....KRGKSSK........", ".....KDDDDDDK.......", ".....KDDDDDDDK......", "......KDK..KDK......", "......KKK..KKK......"],
      walkB: ["......KKKKKKKK......", "....KKHHHHPKPK......", "...KHHHHHHHKKHK.....", "...KHHHHHHHHHHHK....", "...KHHHHHSSSSSSK....", "...KHHHHSSSSKSSK....", "...KHHHHSSSSKSSK....", "...KHHHHSSSSSSSK....", "....KHHHSSSSSSK.....", "....HHKRRRRRKK......", "....KHRGRKSK........", ".....KRGRKSK........", ".....KDDDDDDK.......", ".....KDDDDDDK.......", ".......KDDDK........", ".......KKKKK........"],
      front: [".......KKKKKKKK.KK..", ".....KKHHHHHHKPKPK..", "....KHHHHHHHHHHKK...", "....KHHHHHHHHHHK....", "...KHHSSSSSSSSHHK...", "...KHSSKSSSSKSSHK...", "...KHSSKSSSSKSSHK...", "...KHSSSSSSSSSSHK...", "...KHHSSSSSSSSHHK...", "....HKKRRRRRRKKH....", "...KKSKGRRRRGKSKK...", "....KSKRGGGGRKSK....", ".....KKDDDDDDKK.....", ".....KDDDDDDDDK.....", "......KDDKKDDK......", "......KKK..KKK......"],
      waveA: [".......KKKKKKKK.KK..", ".....KKHHHHHHKPKPK..", "....KHHHHHHHHHHKK...", "....KHHHHHHHHHHK....", "...KHHSSSSSSSSHHKKK.", "...KHSSKSSSSKSSKSSK.", "...KHSSKSSSSKSSKSK..", "...KHSSSSSSSSSSKSK..", "...KHHSSSSSSSSHKSK..", "....HKKRRRRRRKKK....", "...KKSKGRRRRGK......", "....KSKRGGGGRK......", ".....KKDDDDDDKK.....", ".....KDDDDDDDDK.....", "......KDDKKDDK......", "......KKK..KKK......"],
      waveB: [".......KKKKKKKK.KK..", ".....KKHHHHHHKPKPK..", "....KHHHHHHHHHHKK...", "....KHHHHHHHHHKKK...", "...KHHSSSSSSSSKSSK..", "...KHSSKSSSSKSSKSK..", "...KHSSKSSSSKSSKSK..", "...KHSSSSSSSSSSKSK..", "...KHHSSSSSSSSHKSK..", "....HKKRRRRRRKKK....", "...KKSKGRRRRGK......", "....KSKRGGGGRK......", ".....KKDDDDDDKK.....", ".....KDDDDDDDDK.....", "......KDDKKDDK......", "......KKK..KKK......"]
    };
    const PALETTE = { K: "#1f2a2e", H: "#3b2219", S: "#f6d7b0", R: "#2a9d8f", D: "#1f7a70", P: "#e8577a", G: "#c9d1d3" };
    const canvas = document.getElementById("sprite");
    const ctx = canvas.getContext("2d");

    function draw(name) {
      ctx.clearRect(0, 0, 20, 16);
      FRAMES[name].forEach((row, y) => {
        [...row].forEach((ch, x) => {
          if (PALETTE[ch]) { ctx.fillStyle = PALETTE[ch]; ctx.fillRect(x, y, 1, 1); }
        });
      });
    }

    async function waveFor(times) {
      for (let i = 0; i < times; i++) {
        draw("waveA"); await wait(220);
        draw("waveB"); await wait(220);
      }
      draw("front");
    }

    async function walkIn() {
      if (reduced) {
        draw("front");
        return;
      }
      const steps = 14;
      for (let i = 0; i <= steps; i++) {
        canvas.style.transform = `translateX(${Math.round(-100 + 100 * i / steps)}%)`;
        draw(i % 2 ? "walkA" : "walkB");
        await wait(140);
      }
      draw("front");
      await wait(350);
      await waveFor(4);
      while (true) {
        await wait(6000);
        await waveFor(3);
      }
    }
    walkIn();

    // After 4 seconds, zoom out so the page sits on a handheld's screen
    const screenEl = document.getElementById("screen");
    const slot = document.getElementById("slot");
    let zoomed = false;
    const ZOOM_DELAY = 4000;

    // The handheld is drawn at one fixed size and scaled as a whole, so the
    // screen's contents keep the same layout at every window size.
    const DEVICE_W = 760, DEVICE_H = 760 / 2 * 1.05;
    const device = document.querySelector(".device");

    function deviceScale() {
      return Math.min(1, (window.innerWidth * 0.94) / DEVICE_W, (window.innerHeight * 0.92) / DEVICE_H);
    }

    function placeScreen(k) {
      // measure the slot with the device at its final scale
      device.style.transition = "none";
      device.style.transform = `scale(${k})`;
      const r = slot.getBoundingClientRect();
      device.style.transform = "";
      device.offsetHeight;
      device.style.transition = "";
      Object.assign(screenEl.style, {
        top: r.top + "px", left: r.left + "px",
        width: r.width / k + "px", height: r.height / k + "px",
        transform: `scale(${k})`
      });
    }

    function zoomOut() {
      if (zoomed) return;
      zoomed = true;
      const k = deviceScale();
      document.documentElement.style.setProperty("--k", k);
      placeScreen(k);
      document.body.classList.add("zoomed");
      device.inert = false;
      window.addEventListener("resize", () => {
        const k = deviceScale();
        screenEl.style.transition = "none";
        device.style.transition = "none";
        document.documentElement.style.setProperty("--k", k);
        placeScreen(k);
        screenEl.offsetHeight;
        requestAnimationFrame(() => { screenEl.style.transition = ""; device.style.transition = ""; });
      });
    }

    setTimeout(zoomOut, ZOOM_DELAY);

    // Right-hand button: switch between the home screen and About Me
    const views = { home: document.getElementById("home"), about: document.getElementById("about") };
    const btnNext = document.getElementById("btnNext");
    const hintText = document.getElementById("hintText");
    const announce = document.getElementById("announce");
    let current = "home";

    function showScreen(name) {
      if (name === current) return;
      current = name;
      const swap = () => {
        for (const key in views) views[key].hidden = key !== name;
        const next = name === "home" ? "About Me" : "Home";
        hintText.textContent = next;
        btnNext.setAttribute("aria-label", "Show " + (name === "home" ? "About Me" : "home screen"));
        announce.textContent = name === "home" ? "Home screen" : "About Me screen";
      };
      if (reduced) { swap(); return; }
      // a quick blank between screens, like an old LCD redrawing
      screenEl.classList.add("switching");
      setTimeout(() => { swap(); screenEl.classList.remove("switching"); }, 140);
    }

    btnNext.addEventListener("click", () => showScreen(current === "home" ? "about" : "home"));

    // the right arrow key presses the same button
    document.addEventListener("keydown", e => {
      if (!zoomed || e.key !== "ArrowRight" || e.repeat) return;
      btnNext.classList.add("pressed");
      btnNext.click();
      setTimeout(() => btnNext.classList.remove("pressed"), 120);
    });

    // Debug: restart everything from the beginning. Hidden on the live site.
    const resetBtn = document.getElementById("debugReset");
    if (!/(^|\.)miamy\.me$/.test(location.hostname)) {
      resetBtn.hidden = false;
      resetBtn.addEventListener("click", () => location.reload());
    }
  </script>
</body>
</html>
